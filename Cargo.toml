[package]
name = "ganbattea"
version = "0.1.0"
edition = "2021"
description = "Ganbattea – a modern tea timer with custom presets"

[dependencies]
qmetaobject = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rodio = { version = "0.19", default-features = false }

[profile.release]
lto = true
strip = true
