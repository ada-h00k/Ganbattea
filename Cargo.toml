[package]
name = "ganbattea"
version = "0.1.0"
authors = ["ada-h00k"]
edition = "2021"
description = "A timer, stopwatch, and alarm clock built with Rust and Qt Quick"
homepage = "https://github.com/ada-h00k/Ganbattea"
repository = "https://github.com/ada-h00k/Ganbattea"
license = "AGPL-3.0-only"
build = "build.rs"

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
