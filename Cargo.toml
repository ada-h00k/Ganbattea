[package]
name = "ganbattea"
version = "0.1.0"
edition = "2021"
description = "Timer, Stoppuhr und Wecker mit Rust und Qt Quick"
license = "MIT"
build = "build.rs"

[dependencies]
cxx = "1.0.176"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
